name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  schedule:
    # The slow recovery studies. 06:17 UTC on weekdays; off the hour so it does
    # not queue behind every other nightly build on GitHub's runners.
    - cron: "17 6 * * 1-5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Build logs are not readable without admin rights, so a compiler
          # error would otherwise surface only as "exit code 1". Re-emit the
          # diagnostics as annotations, which are readable. shell: bash is
          # explicit because Windows runners default to pwsh.
          if ! pip install -e ".[test]" > build.log 2>&1; then
            grep -iE "error|fatal|undefined" build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -60 build.log
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          # Same reason as above: the job log needs admin rights, and a failing
          # test name is invisible without it. Re-emit the failure summary and
          # each assertion line as an annotation.
          # The examples and the documentation tests have their own step below,
          # so a failure there is named as such and they run once, not twice.
          # --cov is what CI adds over a local run: the floor in
          # [tool.coverage.report] fails the build when a change drops coverage
          # below the measured value, so a new branch of code has to bring a
          # test with it.
          if ! pytest -q -m "not slow" \
              --cov --cov-report=term-missing \
              --ignore=tests/test_examples.py \
              --ignore=tests/test_docs_claims.py \
              --ignore=tests/test_docs_code.py > pytest.log 2>&1; then
            python - <<'PY'
          import pathlib, re
          text = pathlib.Path("pytest.log").read_text(errors="replace")
          # The short summary names every failing test; the traceback carries the
          # assertion. Both are what a reader needs and neither is in a log they
          # can open.
          for line in text.splitlines():
              if re.match(r"^(FAILED|ERROR) ", line):
                  print(f"::error::{line}")
          for line in text.splitlines():
              if line.startswith("E "):
                  print(f"::error::{line[:300]}")
          for line in text.splitlines()[-40:]:
              print(line)
          PY
            exit 1
          fi
          tail -5 pytest.log

      - name: Run the examples and the documentation tests
        shell: bash
        run: |
          # Examples run as subprocesses; docs_claims pins quoted figures to their
          # committed sources; docs_code runs the code blocks in the pages.
          if ! pytest -q -m "not slow" tests/test_examples.py tests/test_docs_claims.py tests/test_docs_code.py > docs-tests.log 2>&1; then
            grep -E "^(FAILED|ERROR) |^E " docs-tests.log | head -40 | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
            tail -40 docs-tests.log
            exit 1
          fi
          tail -3 docs-tests.log

  cpp:
    name: C++ tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pybind11 and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 pytest

      - name: Configure
        run: cmake --preset dev -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build
        shell: bash
        run: |
          if ! cmake --build --preset dev --config Release > build.log 2>&1; then
            grep -iE "error:|error |fatal" build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -80 build.log
            exit 1
          fi

      - name: Run Catch2 suite
        run: ctest --preset dev --build-config Release

      - name: Install extension and run Python tests
        run: |
          pip install scikit-build-core numpy
          pip install -e ".[test]"
          pytest -q -m "not slow" --ignore=tests/test_examples.py --ignore=tests/test_docs_claims.py --ignore=tests/test_docs_code.py

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11

      - name: Build with AddressSanitizer
        run: |
          cmake --preset asan -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build --preset asan --config Release

      - name: Run under AddressSanitizer
        run: |
          # The job log is not readable without admin rights, so a sanitizer
          # report would otherwise surface only as "exit code 1".
          if ! ./build/asan/hawkes_tests > asan.log 2>&1; then
            grep -iE "ERROR|runtime error|FAILED|REQUIRE|with expansion|SUMMARY" asan.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -40 asan.log
            exit 1
          fi

      - name: Build with UndefinedBehaviorSanitizer
        run: |
          cmake --preset ubsan -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build --preset ubsan --config Release

      - name: Run under UndefinedBehaviorSanitizer
        run: |
          # The job log is not readable without admin rights, so a sanitizer
          # report would otherwise surface only as "exit code 1".
          if ! ./build/ubsan/hawkes_tests > ubsan.log 2>&1; then
            grep -iE "ERROR|runtime error|FAILED|REQUIRE|with expansion|SUMMARY" ubsan.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -40 ubsan.log
            exit 1
          fi

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.4.8" "mypy>=1.5.0"
          pip install -e .

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy python/hawkes_engine

  nightly:
    # The recovery studies refit the model 100 times per case, which is the
    # only way to see a small bias but is far too slow for a push. Nightly, so
    # the claim that the estimator is unbiased at 20000 events is checked
    # regularly rather than once.
    name: Slow recovery studies
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run the slow marker
        run: pytest -q -m slow
