name: Build Wheels

# Manual dispatch while the project is pre-alpha, and a tag on top of it. There
# is deliberately no push trigger: a wheel build is minutes of every runner, and
# the test matrix already covers a push.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_tag:
    # A tag publishes; a mismatch must stop before anything is built, so the run
    # is cheap to read and nothing can reach PyPI under the wrong version. The
    # version string is read from pyproject.toml, the same file PyPI reads, so
    # there is no second place for it to drift.
    name: Tag matches the package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare the tag with pyproject.toml
        id: version
        shell: bash
        run: |
          declared=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          tag="${GITHUB_REF_NAME#v}"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${declared}"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches pyproject version $declared"

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    timeout-minutes: 60
    needs: [check_tag]
    # A skipped check_tag (manual dispatch) must still build.
    if: always() && (needs.check_tag.result == 'success' || needs.check_tag.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          # ADR-006: cp310-cp312 on generic x86-64, no -march=native and no
          # -ffast-math. musllinux is skipped on purpose: the core has no
          # dependency that differs on musl, so those wheels would be untested
          # duplicates of the manylinux ones, and each one is a runner minute.
          CIBW_BUILD: cp310-* cp311-* cp312-*
          CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686 *_i686"
          CIBW_ARCHS_LINUX: x86_64
          # Two separate wheels, not universal2: an arm64 build of the core has
          # its own ISA assumptions, and a universal2 merge would have to hold
          # both at once.
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD_VERBOSITY: 1
          # Not a release build by accident: scikit-build-core reads the CMake
          # build type from CMAKE_BUILD_TYPE, and a wheel built with CMake's
          # default (empty) is a debug build.
          CIBW_ENVIRONMENT: CMAKE_BUILD_TYPE=Release
          # The test command is the point of the wheel build. It imports the
          # package, evaluates a likelihood and runs a simulation, so a wheel
          # that links but cannot compute fails here rather than at a user.
          CIBW_TEST_COMMAND: >-
            python -m hawkes_engine._selftest
          CIBW_TEST_REQUIRES: numpy>=1.24 scipy>=1.10

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

      - name: Summarise artefacts
        shell: bash
        run: |
          ls -l wheelhouse/
          echo "### ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          ls wheelhouse/*.whl >> "$GITHUB_STEP_SUMMARY"

  build_sdist:
    name: Source distribution
    timeout-minutes: 15
    needs: [check_tag]
    if: always() && (needs.check_tag.result == 'success' || needs.check_tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  check_artefacts:
    # twine check reads the metadata a user's pip will read. It runs on the
    # assembled set, so a wheel with a broken long-description fails the run
    # rather than the publish.
    name: Check artefacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Twine check
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
          ls -l dist/

  upload_pypi:
    name: Upload to PyPI
    needs: [check_tag, check_artefacts]
    runs-on: ubuntu-latest
    # A tag is the only thing that publishes. A manual dispatch builds and
    # uploads artefacts to the run and stops there. check_tag only exists on a
    # tag push, so requiring it to succeed is also a second refusal path.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check_tag.result == 'success'
    # Trusted publishing: PyPI verifies a short-lived OIDC token, so no API
    # token is stored in this repository. The environment is where the
    # maintainer approves the run; a publish that has not been approved in
    # the GitHub UI cannot start.
    environment:
      name: pypi
      url: https://pypi.org/p/hawkes-engine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
